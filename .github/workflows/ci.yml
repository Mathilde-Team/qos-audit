# CI du socle Mathilde-Team (SOCLE §4). Le job « Qualité (lint, tests) » est
# un check requis sur main et dev (.github/branch-protection/*.json, issue #3) :
# garder son nom. Version minimale de Python (requires-python >= 3.11) pour
# tester la borne basse. Le seuil de couverture n'est pas encore déclaré dans
# pyproject.toml : il arrive avec l'issue #5 ([tool.coverage.report]
# fail_under) et cette commande le lira sans modification.
name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Qualité (lint, tests)
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}
    # Leçon AsyncRdp4#59 / SwitchCapture#98 : tout job borné dans le temps.
    timeout-minutes: 15

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Installation de Python
        run: uv python install 3.11

      # ruff figé à la même version que pyproject.toml (groupe dev, `make lint`) et
      # .pre-commit-config.yaml (v0.17.2) : les trois montent ensemble (#75) ;
      # la ligne de 120 caractères est celle de [tool.ruff] du pyproject.toml.
      - name: Lint et format (ruff)
        run: |
          uvx ruff@0.17.2 check --line-length 120 .
          uvx ruff@0.17.2 format --check --line-length 120 .

      # Le paquet est installé en éditable : disposition src/ sans build-system
      # déclaré, les dépendances de test (pytest, pytest-cov) restent éphémères,
      # versions figées (SOCLE §4 : les versions ne montent que volontairement).
      # Couverture des branches incluse (SOCLE §4) ; le seuil bloquant sera lu
      # dans pyproject.toml dès que l'issue #5 l'y déclarera.
      - name: Tests et couverture
        run: >
          uv run --no-project --python 3.11
          --with pytest==9.1.1 --with pytest-cov==7.1.0 --with-editable .
          pytest --cov=src/qos_audit --cov-branch --cov-report=term-missing

  # Intégration contre un vrai OpenSearch (#17). Non bloquant au début, comme
  # le demande l'issue : ce job n'est pas un check requis et continue-on-error
  # le garde hors du verdict de la PR. Runner hébergé par GitHub (service
  # conteneur ~250 Mo) pour épargner le disque des runners maison
  # (Mathilde-Team/.github#12) ; image et runner figés.
  integration:
    name: Intégration OpenSearch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Installation de Python
        run: uv python install 3.11

      # --durations=0 : temps de réponse des requêtes sur 60 min et 24 h dans
      # le journal du job (case « performances » de #17).
      - name: Tests d'intégration (pytest -m integration)
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: >
          uv run --no-project --python 3.11
          --with pytest==9.1.1 --with-editable .
          pytest -m integration tests/test_integration_opensearch.py --durations=0
