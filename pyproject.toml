[project]
name = "qos-audit"
version = "0.1.0"
description = "Qualification automatisée de la mise en oeuvre QoS (politique théorique vs mesures ElastiFlow/sFlow)"
requires-python = ">=3.11"
dependencies = ["opensearch-py>=2.4", "pyyaml>=6", "loguru>=0.7", "jinja2>=3.1"]

[project.scripts]
qos-audit = "qos_audit.cli:main"

[tool.ruff]
line-length = 120

# Couverture (SOCLE §4) : branches comprises, seuil bloquant déclaré ici et
# nulle part ailleurs. Dépôt sous 95 % : palier 1 = mesure du 25/10/2026 (#5),
# à relever à chaque PR de tests jusqu'à 95.
[tool.coverage.run]
branch = true
source = ["src/qos_audit"]

[tool.coverage.report]
fail_under = 90
show_missing = true
