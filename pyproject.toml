[project]
name = "qos-audit"
version = "0.1.0"
description = "Qualification automatisée de la mise en oeuvre QoS (politique théorique vs mesures ElastiFlow/sFlow)"
requires-python = ">=3.11"
dependencies = ["opensearch-py>=2.4", "pyyaml>=6", "loguru>=0.7", "jinja2>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qos_audit"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
qos-audit = "qos_audit.cli:main"

[tool.ruff]
line-length = 120

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Palier socle (le dépôt précède le socle à 95 % lignes ET branches) : seuil fixé à la mesure du moment.
# Mesuré à cette contribution : 82,2 % lignes, 72,3 % branches, 79,7 % combiné (fail_under porte sur le combiné).
# À relever à chaque contribution ; ne jamais le baisser.
fail_under = 79

[tool.qos-audit.coverage-paliers]
# Mesure du moment (2026-10-25) arrondie à l'entier inférieur : 82,2 % lignes, 72,3 % branches.
# Vérifiés ligne par ligne et branche par branche par scripts/check_coverage_paliers.py.
lignes = 82
branches = 72
