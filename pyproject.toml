[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qos-audit"
version = "0.1.0"
description = "Qualification automatisée de la mise en oeuvre QoS (politique théorique vs mesures ElastiFlow/sFlow)"
requires-python = ">=3.11"
dependencies = ["opensearch-py>=2.4", "pyyaml>=6", "loguru>=0.7", "jinja2>=3.1"]

[project.optional-dependencies]
# Collecte des drops par file en SSH (issue #10) : « uv sync --extra comware ».
# Version figée (SOCLE §4).
comware = ["netmiko==4.8.0"]

[project.scripts]
qos-audit = "qos_audit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Version figée (SOCLE §4) : ne monte que volontairement.
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests d'intégration (#17) demandent un OpenSearch : job CI « Intégration OpenSearch » (pytest -m integration).
addopts = "-ra -m 'not integration'"
markers = ["integration: requiert un OpenSearch joignable (variable OPENSEARCH_URL)"]

[tool.coverage.run]
# Couverture des branches obligatoire (SOCLE.md §4).
branch = true
source = ["src/qos_audit"]

[tool.coverage.report]
# Seuil bloquant de l'équipe : 95 % (Mathilde-Team/.github#9), atteint le 26/10/2026 (95,90 %, #5).
fail_under = 95
show_missing = true
skip_covered = false
