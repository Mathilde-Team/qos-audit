<rtr-a-01>display current-configuration
#
 sysname rtr-a-01
#
 sflow agent ip 10.255.0.1
 sflow collector 1 ip 10.20.0.5 port 6343
object-group ip address PBX
 0 network subnet 10.10.5.0 255.255.255.0
 5 network host address 10.10.6.10
#
acl advanced 3001
 description VOIX-RTP
 rule 10 permit udp source object-group PBX destination-port range 16384 32767
 rule 20 permit udp destination object-group PBX destination-port range 16384 32767
#
acl advanced name QOS-SIP
 rule 10 permit udp destination-port eq 5060
 rule 20 permit tcp destination-port range 5060 5061
#
acl advanced 3003
 rule 10 deny tcp source 10.0.0.0 0.0.0.255 destination-port eq smtp
 rule 20 permit tcp destination-port eq smtp
#
acl advanced 3004
 rule 10 permit tcp destination 10.20.0.0 0.0.255.255 destination-port eq 443
 rule 20 permit tcp destination 10.30.0.0 0.0.0.254 destination-port eq 443
 rule 30 permit udp dscp ef
#
acl ipv6 advanced 3500
 rule 10 permit ipv6
#
traffic classifier VOIX operator or
 if-match acl 3001
traffic classifier SIP operator or
 if-match acl name QOS-SIP
traffic classifier SMTP operator and
 if-match acl 3003
traffic classifier METIER operator and
 if-match acl 3004
traffic classifier DEFAUT operator and
 if-match any
#
traffic behavior B-EF
 remark dscp ef
traffic behavior B-D1
 remark dscp af31
traffic behavior B-D2
 remark dscp af21
 car cir 5000 cbs 625000 ebs 0 green pass red discard
traffic behavior B-D3
 remark dscp af11
traffic behavior B-BF
 remark dscp default
#
qos policy MARK-LAN
 classifier VOIX behavior B-EF
 classifier SIP behavior B-D1
 classifier METIER behavior B-D2
 classifier SMTP behavior B-D3
qos policy MARK-ACCES
 classifier DEFAUT behavior B-BF
qos policy NOT-APPLIED
 classifier SIP behavior B-D1
#
interface Ten-GigabitEthernet1/0/1
 description LAN uplink
 sflow sampling-mode random
 sflow sampling-rate 512
 sflow flow collector 1
 sflow counter collector 1
 sflow counter interval 30
 qos apply policy MARK-LAN inbound
#
interface GigabitEthernet1/0/10
 description acces utilisateurs
 sflow sampling-mode random
 sflow sampling-rate 128
 sflow flow collector 1
 sflow counter collector 1
 sflow counter interval 300
 qos apply policy MARK-ACCES inbound
#
interface GigabitEthernet1/0/49
 description WAN1
 qos trust dscp
#
return
